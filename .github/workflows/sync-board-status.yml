# Y클라우드 게시판 현황 자동 동기화 (30분마다)
name: Sync Board Status

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: board-status-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Download source spreadsheet (google sheets, shared link)
        run: |
          curl -sL -w "HTTP:%{http_code} TYPE:%{content_type} SIZE:%{size_download}\n" \
            -o /tmp/board-status-source.xlsx \
            "https://docs.google.com/spreadsheets/d/1aF5gnTNRObLexo_QvDfOWHE1YzSCNCVY/export?format=xlsx"
          file /tmp/board-status-source.xlsx
          python -c "
          import openpyxl
          wb = openpyxl.load_workbook('/tmp/board-status-source.xlsx', data_only=True)
          ws = wb['콘텐츠 현황']
          rows = [r for r in ws.iter_rows(min_row=2, values_only=True) if r and r[0]]
          print('downloaded item count:', len(rows))
          print('last row id:', rows[-1][0] if rows else None)
          "

      - name: Generate dashboard
        id: generate
        run: |
          result=$(python scripts/generate_board_status.py /tmp/board-status-source.xlsx docs/board-status.html "Y클라우드_게시판 현황_원본데이터 (팀 공유 구글시트)")
          echo "generate result: $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        if: steps.generate.outputs.result == 'CHANGED'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/board-status.html
          if git diff --cached --quiet; then
            echo "no diff, skipping"
          else
            git commit -m "자동 동기화: 게시판 현황 갱신 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
